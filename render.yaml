# PAID / Starter blueprint (Render Postgres + Redis).
# Uploads go to Cloudinary — no persistent disk required.
#
# Deploy from: https://dashboard.render.com → New → Blueprint
# For free-tier: Free Docker Web Service + Neon Postgres + Upstash Redis
# + Cloudinary (see deployment guide).

services:
  - type: web
    name: kitchenos-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: kitchenos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: kitchenos-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Fill these in the Render UI before the first successful boot:
      - key: CLIENT_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: redis
    name: kitchenos-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: kitchenos-db
    plan: basic-256mb
    databaseName: kitchenos
    user: kitchenos
