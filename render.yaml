# KitchenOS production blueprint (this repo's definitive Render config).
# Deploy from: https://dashboard.render.com → New → Blueprint
# Requires: GitHub repo with this file at the repository root.

services:
  - type: web
    name: kitchenos-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    disk:
      name: kitchenos-uploads
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: kitchenos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: kitchenos-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Fill these in the Render UI before the first successful boot:
      - key: CLIENT_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: redis
    name: kitchenos-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: kitchenos-db
    plan: basic-256mb
    databaseName: kitchenos
    user: kitchenos
